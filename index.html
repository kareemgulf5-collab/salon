<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020818">
<title>تسجيل الدخول — مصطفي عاشور</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020818;--bg2:#060e2a;--b700:#0d1f5c;--b600:#1a3080;--b500:#2546b0;--b400:#3a62d4;
  --accent:#38bdf8;--accent2:#0ea5e9;--white:#f0f6ff;--muted:#7f95bf;
  --border:rgba(56,189,248,.14);--border2:rgba(56,189,248,.3);
  --card:rgba(10,22,64,.72);--input:rgba(2,8,24,.65);
  --green:#10b981;--red:#f43f5e;--amber:#f59e0b;--purple:#a78bfa;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;direction:rtl;overflow-x:hidden;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,189,248,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.c-accent{color:var(--accent)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-purple{color:var(--purple)}
.bold{font-weight:700}
.small{font-size:12px}

/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title .t{display:flex;align-items:center;gap:8px}
.sub{font-size:12px;color:var(--muted);font-weight:400}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--border2);background:rgba(56,189,248,.08);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s,opacity .2s;white-space:nowrap;line-height:1.3}
.btn:hover{background:rgba(56,189,248,.16)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--b400));color:#fff;border:none;box-shadow:0 4px 18px rgba(14,165,233,.25)}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent2),var(--b400));transform:translateY(-1px);box-shadow:0 8px 24px rgba(14,165,233,.35)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:hover{background:rgba(56,189,248,.06);color:var(--accent)}
.btn-danger{background:rgba(244,63,94,.08);color:var(--red);border-color:rgba(244,63,94,.25)}
.btn-danger:hover{background:rgba(244,63,94,.16)}
.btn-success{background:rgba(16,185,129,.08);color:var(--green);border-color:rgba(16,185,129,.25)}
.btn-success:hover{background:rgba(16,185,129,.16)}
.btn-warn{background:rgba(245,158,11,.08);color:var(--amber);border-color:rgba(245,158,11,.25)}
.btn-warn:hover{background:rgba(245,158,11,.16)}
.btn-purple{background:rgba(167,139,250,.08);color:var(--purple);border-color:rgba(167,139,250,.25)}
.btn-purple:hover{background:rgba(167,139,250,.16)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:7px}
.btn-block{width:100%}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ===== forms ===== */
.field{margin-bottom:12px}
.label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:6px}
.input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--white);font-size:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input-sm{padding:7px 11px;font-size:13px;width:auto}
select.input option{background:var(--bg2);color:var(--white)}
textarea.input{resize:vertical;min-height:44px}
input[type=date].input,input[type=month].input,input[type=time].input{color-scheme:dark}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent2)}

/* segmented */
.seg{display:flex;gap:4px;background:rgba(2,8,24,.5);border:1px solid var(--border);border-radius:11px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 12px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button:hover{color:var(--white)}
.seg button.active{background:linear-gradient(135deg,var(--b600),var(--b500));color:#fff;box-shadow:0 2px 10px rgba(37,70,176,.4)}

/* ===== table ===== */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{color:var(--muted);font-size:11px;font-weight:700;padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px;border-bottom:1px solid rgba(56,189,248,.06);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr:hover td{background:rgba(56,189,248,.03)}
.table tfoot td{font-weight:700;border-top:1px solid var(--border);color:var(--accent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.chip-blue{background:rgba(56,189,248,.1);color:var(--accent);border:1px solid rgba(56,189,248,.2)}
.chip-green{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.chip-amber{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.chip-red{background:rgba(244,63,94,.1);color:var(--red);border:1px solid rgba(244,63,94,.2)}
.chip-purple{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.chip-gray{background:rgba(127,149,191,.1);color:var(--muted);border:1px solid rgba(127,149,191,.2)}

/* empty */
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty .ei{font-size:30px;margin-bottom:6px}
.empty p{font-size:13px}

/* alerts */
.alert{border-radius:11px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.7}
.alert-err{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:#fda4af}
.alert-ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7}
.alert-info{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);color:var(--white)}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#fcd34d}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent))}
.kpi-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(56,189,248,.1);flex-shrink:0}
.kpi-lbl{font-size:12px;color:var(--muted)}
.kpi-val{font-size:23px;font-weight:900;color:var(--kc,var(--accent));line-height:1.25;word-break:break-word}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* horizontal bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-name{width:105px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:rgba(56,189,248,.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--b400),var(--accent));transition:width .6s}
.bar-val{min-width:64px;text-align:left;font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}

/* progress */
.progress{width:100%;height:9px;background:rgba(56,189,248,.08);border-radius:20px;overflow:hidden}
.progress>div{height:100%;border-radius:20px;transition:width .6s}
.p-low{background:linear-gradient(90deg,var(--red),#fb7185)}
.p-mid{background:linear-gradient(90deg,var(--amber),#fcd34d)}
.p-done{background:linear-gradient(90deg,var(--green),#34d399)}

/* ===== modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(2,8,24,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:14px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px;width:460px;max-width:100%;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:fadeUp .2s both}
.modal.wide{width:620px}
.modal h2{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:18px;padding-left:34px}
.modal-close{position:absolute;top:14px;left:14px;background:rgba(244,63,94,.1);border:none;border-radius:8px;color:var(--red);width:30px;height:30px;cursor:pointer;font-size:13px}
.modal-close:hover{background:rgba(244,63,94,.2)}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}

/* receipt preview */
.receipt-paper{background:#fff;border-radius:12px;padding:18px;max-width:340px;margin:0 auto}

/* ===== toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,var(--b700),var(--b600));border:1px solid var(--border2);border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;z-index:2000;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.45);max-width:92vw;text-align:center}
.toast:empty,.toast:not(.show){visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast.err{border-color:rgba(244,63,94,.5)}
.toast.ok{border-color:rgba(16,185,129,.5)}

/* ===== loader ===== */
.loader-screen{position:fixed;inset:0;background:var(--bg);z-index:3000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.spinner{width:42px;height:42px;border:3px solid rgba(56,189,248,.15);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.btn .spinner{width:16px;height:16px;border-width:2px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b600);border-radius:4px}

@media(max-width:600px){
  .row2,.row3{grid-template-columns:1fr}
  .modal{padding:20px 16px}
  .kpi-val{font-size:20px}
}

</style>
<style>
body::after{content:'';position:fixed;top:-30%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(37,70,176,.28) 0%,transparent 70%);pointer-events:none;z-index:0}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:36px 32px;width:420px;max-width:100%;box-shadow:0 32px 80px rgba(0,0,0,.6);animation:fadeUp .4s both}
.auth-logo{text-align:center;margin-bottom:24px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent2),var(--b400));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
.auth-logo h1{font-size:22px;font-weight:900}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:2px}
.auth-box .input{padding:12px 15px;font-size:15px}
.auth-box .input[type=email]{direction:ltr;text-align:left}
.pass-wrap{position:relative}
.pass-wrap .input{direction:ltr;text-align:left;padding-right:44px}
.pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:.7;padding:6px}
.auth-btn{width:100%;padding:13px;font-size:16px;margin-top:6px}
.auth-links{text-align:center;margin-top:16px;font-size:13px}
.auth-links button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px}
.setup-note{font-size:13px;line-height:1.8}
.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="loader-screen" id="loader"><div class="spinner"></div><div id="loaderMsg">جاري التحميل...</div></div>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">✂️</div>
      <h1>مصطفي عاشور</h1>
      <p>نظام إدارة الصالون</p>
    </div>

    <div class="alert alert-err hidden" id="authErr"></div>

    <form id="loginForm" onsubmit="event.preventDefault();doLogin()">
      <div class="field"><label class="label">الإيميل</label><input class="input" type="email" id="lEmail" autocomplete="username" required></div>
      <div class="field"><label class="label">الباسورد</label>
        <div class="pass-wrap"><input class="input" type="password" id="lPass" autocomplete="current-password" required><button type="button" class="pass-eye" onclick="togglePass('lPass')">👁️</button></div>
      </div>
      <button class="btn btn-primary auth-btn" id="loginBtn" type="submit">دخول لوحة المالك ←</button>
      <div class="auth-links"><a href="cashier.html">🏧 فتح الكاشير</a></div>
    </form>

    <div class="foot">🔒 هذه الصفحة خاصة بصاحب المكان فقط</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   core.js — الإعدادات والأدوات المشتركة بين كل الصفحات
   ========================================================= */

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDNqPr1L_2I-PBEUbtDTxeNe9ljwmFjtBA",
  authDomain: "mostafa-ashour.firebaseapp.com",
  projectId: "mostafa-ashour",
  storageBucket: "mostafa-ashour.firebasestorage.app",
  messagingSenderId: "216558854202",
  appId: "1:216558854202:web:f743810852973ec7ebd503"
};
firebase.initializeApp(firebaseConfig);
const fs = firebase.firestore();
const FV = firebase.firestore.FieldValue;
// كاش محلي: الصفحة تفتح بسرعة وتستحمل قطع النت لحظياً
try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}

// ===== ثوابت =====
const PAY = { cash: 'كاش', vodafone: 'فودافون كاش', instapay: 'إنستاباي', card: 'فيزا' };
const ROLE = { owner: 'المالك', cashier: 'كاشير' };
const DEFAULT_SHOP = { name: 'مصطفي عاشور', phone: '', address: '', footer: 'شكراً لزيارتكم ✂️\nنراكم في زيارة قادمة' };
const LOCALE = 'ar-EG-u-nu-latn';

// ===== أدوات عامة =====
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const pad = n => String(n).padStart(2, '0');
// تاريخ محلي (بتوقيت الجهاز) — بدل toISOString اللي كان بيرجع UTC
function localDate(d = new Date()) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDate(ds) { const [y, m, d] = String(ds).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(ds, n) { const d = parseDate(ds); d.setDate(d.getDate() + n); return localDate(d); }
function monthFirst(ds, n = 0) { const d = parseDate(ds); return localDate(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
function monthLast(ds, n = 0) { const d = parseDate(ds); return localDate(new Date(d.getFullYear(), d.getMonth() + n + 1, 0)); }
function fmtDate(ds, opts = { day: 'numeric', month: 'short' }) { if (!ds) return '—'; return parseDate(ds).toLocaleDateString(LOCALE, opts); }
function fmtDateLong(ds) { return fmtDate(ds, { weekday: 'long', day: 'numeric', month: 'long' }); }
function fmtMonth(ym) { return parseDate(ym + '-01').toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' }); }
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleTimeString(LOCALE, { hour: 'numeric', minute: '2-digit' }); }
function fmt12(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'م' : 'ص'; return `${((h + 11) % 12) + 1}:${pad(m || 0)} ${ap}`; }
const round2 = n => Math.round((+n || 0) * 100) / 100;
function fmtNum(n) { return round2(n).toLocaleString('en-US'); }
function money(n) { return fmtNum(n) + ' ج'; }
function sum(arr, f) { return arr.reduce((s, x) => s + (+f(x) || 0), 0); }
function snapList(snap) { return snap.docs.map(d => ({ id: d.id, ...d.data() })); }
function byName(a, b) { return String(a.name || '').localeCompare(String(b.name || ''), 'ar'); }
function svcSort(a, b) { return ((a.order ?? 999) - (b.order ?? 999)) || byName(a, b); }
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function digits(s) { return String(s ?? '').replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/\D/g, ''); }
// توحيد الحروف العربية للبحث (أ/إ/آ = ا ، ة = ه ، ى = ي)
function norm(s) {
  return String(s ?? '').toLowerCase()
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[ً-ْـ]/g, '')
    .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d))
    .replace(/\s+/g, ' ').trim();
}
function waLink(phone) { const p = digits(phone); if (!p) return ''; return 'https://wa.me/' + (p.startsWith('0') ? '2' + p : p); }
function validPhone(p) { return /^01[0125]\d{8}$/.test(digits(p)); }

// ===== Toast =====
let _toastTimer;
function toast(msg, type = '') {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => { t.className = 'toast ' + type; }, 3200);
}

// ===== Modals =====
function openModal(id) {
  const m = $(id); m.classList.add('open');
  const f = m.querySelector('[autofocus],input:not([type=hidden]):not([readonly]),select,textarea');
  if (f && window.innerWidth > 700) setTimeout(() => f.focus(), 60);
}
function closeModal(id) { $(id).classList.remove('open'); }
document.addEventListener('mousedown', e => { if (e.target.classList && e.target.classList.contains('modal-overlay')) e.target.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); });

function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + (label || 'جاري الحفظ...'); }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

// ===== Loader =====
function hideLoader() { const l = $('loader'); if (l) l.classList.add('hidden'); }
function loaderMsg(msg) { const l = $('loaderMsg'); if (l) l.innerHTML = msg; }

// ===== رسائل الأخطاء =====
function authErr(e) {
  const m = {
    'auth/invalid-credential': 'الإيميل أو الباسورد غلط',
    'auth/invalid-login-credentials': 'الإيميل أو الباسورد غلط',
    'auth/wrong-password': 'الباسورد غلط',
    'auth/user-not-found': 'الإيميل ده مش متسجل',
    'auth/invalid-email': 'الإيميل مكتوب غلط',
    'auth/missing-password': 'اكتب الباسورد',
    'auth/too-many-requests': 'محاولات كتير — استنى شوية وجرب تاني',
    'auth/network-request-failed': 'مفيش اتصال بالإنترنت',
    'auth/email-already-in-use': 'الإيميل ده مستخدم قبل كده',
    'auth/weak-password': 'الباسورد ضعيف — ٦ حروف على الأقل',
    'auth/operation-not-allowed': 'لازم تفعّل الدخول بالإيميل من Firebase Console ← Authentication ← Sign-in method ← Email/Password',
    'auth/requires-recent-login': 'سجّل خروج وادخل تاني وبعدين جرّب',
    'auth/user-disabled': 'الحساب ده موقوف',
    'auth/configuration-not-found': 'خدمة تسجيل الدخول مش متفعلة في Firebase — ادخل Firebase Console ← Authentication ← Get started ← Sign-in method ← Email/Password ← Enable ← Save',
    'auth/admin-restricted-operation': 'إنشاء الحسابات مقفول — فعّل Email/Password من Firebase Console ← Authentication ← Sign-in method'
  };
  return m[e && e.code] || (e && e.message) || 'حصل خطأ';
}
function fsErr(e) {
  if (!e) return 'حصل خطأ';
  if (e.code === 'permission-denied') return 'مفيش صلاحية للعملية دي';
  if (e.code === 'unavailable' || e.code === 'failed-precondition' && /offline/i.test(e.message)) return 'مفيش اتصال بالإنترنت';
  if (String(e.code || '').startsWith('auth/')) return authErr(e);
  return e.message || 'حصل خطأ';
}

// ===== الدخول (زي النظام القديم: إيميل وباسورد محفوظين في salon/auth) =====
const OWNER_KEY = 'salonLoggedIn';
const AUTH_DOC = () => fs.collection('salon').doc('auth');
function isOwnerSession() { try { return sessionStorage.getItem(OWNER_KEY) === '1'; } catch (e) { return false; } }
async function getCreds() {
  const s = await AUTH_DOC().get();
  if (s.exists && s.data() && s.data().email) return s.data();
  const def = { email: 'admin@salon.com', pass: '123456', lastLogin: null };
  await AUTH_DOC().set(def).catch(() => {});
  return def;
}
function requireAuth(roles, onReady) {
  const owner = isOwnerSession();
  if (!roles.includes('cashier') && !owner) { location.replace('index.html'); return; }
  window.ME = owner ? { uid: 'owner', name: 'المالك', role: 'owner', email: '' } : { uid: 'cashier', name: 'الكاشير', role: 'cashier', email: '' };
  // بعد ما باقي الكود يتحمّل
  setTimeout(async () => {
    try { await onReady(window.ME); }
    catch (e) { console.error(e); loaderMsg('⚠️ ' + esc(fsErr(e)) + '<br><br><button class="btn" onclick="location.reload()">إعادة المحاولة</button>'); }
  }, 0);
}
function logout() {
  if (!confirm('تسجيل الخروج؟')) return;
  try { sessionStorage.removeItem(OWNER_KEY); } catch (e) {}
  location.replace('index.html');
}

// طباعة من غير popup (عن طريق iframe مخفي) — مناسبة لطابعات الكاشير 80mm
function printReceipt(inv, shop) {
  const old = $('printFrame'); if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'printFrame';
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:80mm;height:400px;border:0;';
  document.body.appendChild(f);
  const w = f.contentWindow;
  w.document.open();
  w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>@page{size:80mm auto;margin:3mm}body{margin:0;background:#fff}${RECEIPT_CSS}</style></head>
<body>${receiptHTML(inv, shop)}</body></html>`);
  w.document.close();
  let done = false;
  const go = () => { if (done) return; done = true; try { w.focus(); w.print(); } catch (e) { toast('⚠️ تعذرت الطباعة'); } };
  setTimeout(() => { try { w.document.fonts.ready.then(() => setTimeout(go, 150)); } catch (e) { go(); } }, 400);
  setTimeout(go, 2500);
}

// ===== تصدير =====
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function toCSV(rows) {
  return '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
}

<script>
function showErr(m){ const e=$('authErr'); e.textContent='❌ '+m; e.classList.remove('hidden'); }
function togglePass(id){ const i=$(id); i.type=i.type==='password'?'text':'password'; }
if (isOwnerSession()) location.replace('dashboard.html');
else { hideLoader(); setTimeout(()=>$('lEmail').focus(),50); }
async function doLogin(){
  $('authErr').classList.add('hidden');
  const email=$('lEmail').value.trim(), pass=$('lPass').value;
  if(!email||!pass) return showErr('اكتب الإيميل والباسورد');
  const btn=$('loginBtn'); setBusy(btn,true,'جاري الدخول...');
  try{
    const c=await getCreds();
    if(email.toLowerCase()===String(c.email).toLowerCase() && pass===c.pass){
      await AUTH_DOC().set({...c,lastLogin:new Date().toLocaleString('ar-EG')}).catch(()=>{});
      try{ sessionStorage.setItem(OWNER_KEY,'1'); }catch(e){}
      location.replace('dashboard.html');
      return;
    }
    showErr('الإيميل أو الباسورد غلط'); $('lPass').value=''; $('lPass').focus();
  }catch(e){ showErr(fsErr(e)); }
  setBusy(btn,false);
}
</script>
