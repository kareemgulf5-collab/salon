<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020818">
<title>تسجيل الدخول — مصطفي عاشور</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
body::after{content:'';position:fixed;top:-30%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(37,70,176,.28) 0%,transparent 70%);pointer-events:none;z-index:0}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:36px 32px;width:420px;max-width:100%;box-shadow:0 32px 80px rgba(0,0,0,.6);animation:fadeUp .4s both}
.auth-logo{text-align:center;margin-bottom:24px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent2),var(--b400));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
.auth-logo h1{font-size:22px;font-weight:900}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:2px}
.auth-box .input{padding:12px 15px;font-size:15px}
.auth-box .input[type=email]{direction:ltr;text-align:left}
.pass-wrap{position:relative}
.pass-wrap .input{direction:ltr;text-align:left;padding-right:44px}
.pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:.7;padding:6px}
.auth-btn{width:100%;padding:13px;font-size:16px;margin-top:6px}
.auth-links{text-align:center;margin-top:16px;font-size:13px}
.auth-links button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px}
.setup-note{font-size:13px;line-height:1.8}
.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="loader-screen" id="loader"><div class="spinner"></div><div id="loaderMsg">جاري التحميل...</div></div>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">✂️</div>
      <h1>مصطفي عاشور</h1>
      <p>نظام إدارة الصالون</p>
    </div>

    <div class="alert alert-err hidden" id="authErr"></div>
    <div class="alert alert-ok hidden" id="authOk"></div>

    <!-- LOGIN -->
    <form id="loginForm" class="hidden" onsubmit="event.preventDefault();doLogin()">
      <div class="field"><label class="label">الإيميل</label><input class="input" type="email" id="lEmail" autocomplete="username" required></div>
      <div class="field"><label class="label">الباسورد</label>
        <div class="pass-wrap"><input class="input" type="password" id="lPass" autocomplete="current-password" required><button type="button" class="pass-eye" onclick="togglePass('lPass')">👁️</button></div>
      </div>
      <button class="btn btn-primary auth-btn" id="loginBtn" type="submit">دخول ←</button>
      <div class="auth-links"><button type="button" onclick="forgot()">نسيت الباسورد؟</button></div>
    </form>

    <!-- FIRST-TIME SETUP -->
    <form id="setupForm" class="hidden" onsubmit="event.preventDefault();doSetup()">
      <div class="alert alert-info setup-note">👋 <b>أول تشغيل للنظام الجديد.</b><br>اعمل حساب <b>المالك</b> دلوقتي. بعد الدخول هتلاقي زرار ترحيل البيانات القديمة (مش هيتمسح منها حاجة)، وتقدر تعمل حسابات للكاشير من صفحة المستخدمين.</div>
      <div class="field"><label class="label">اسمك</label><input class="input" id="sName" placeholder="مثال: مصطفى عاشور" required></div>
      <div id="sCredFields">
        <div class="field"><label class="label">الإيميل</label><input class="input" type="email" id="sEmail" autocomplete="username"></div>
        <div class="row2">
          <div class="field"><label class="label">الباسورد</label><input class="input" type="password" id="sPass" autocomplete="new-password" style="direction:ltr"></div>
          <div class="field"><label class="label">تأكيد الباسورد</label><input class="input" type="password" id="sPass2" autocomplete="new-password" style="direction:ltr"></div>
        </div>
      </div>
      <div class="alert alert-info hidden" id="sSignedAs"></div>
      <button class="btn btn-primary auth-btn" id="setupBtn" type="submit">إنشاء حساب المالك ←</button>
    </form>

    <div class="foot">🔒 الدخول للمالك والكاشير فقط</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/core.js"></script>
<script>
let settingUp = false;
function showErr(m){ $('authOk').classList.add('hidden'); const e=$('authErr'); e.textContent='❌ '+m; e.classList.remove('hidden'); }
function showOk(m){ $('authErr').classList.add('hidden'); const e=$('authOk'); e.textContent='✅ '+m; e.classList.remove('hidden'); }
function clearMsgs(){ $('authErr').classList.add('hidden'); $('authOk').classList.add('hidden'); }
function showLogin(){ $('setupForm').classList.add('hidden'); $('loginForm').classList.remove('hidden'); setTimeout(()=>$('lEmail').focus(),50); }
function showSetup(user){
  $('loginForm').classList.add('hidden'); $('setupForm').classList.remove('hidden');
  if(user){ $('sCredFields').classList.add('hidden'); const s=$('sSignedAs'); s.textContent='هيتعمل حساب المالك على الإيميل: '+user.email; s.classList.remove('hidden'); }
}
function togglePass(id){ const i=$(id); i.type=i.type==='password'?'text':'password'; }

auth.onAuthStateChanged(async user => {
  if (settingUp) return;
  try {
    if (user) {
      const st = await fs.collection('staff').doc(user.uid).get();
      if (st.exists && st.data().active !== false) { location.replace(st.data().role === 'owner' ? 'dashboard.html' : 'cashier.html'); return; }
      const setup = await fs.collection('meta').doc('setup').get();
      if (!setup.exists) { showSetup(user); hideLoader(); return; }
      await auth.signOut();
      showErr(st.exists ? 'الحساب ده موقوف — كلّم صاحب المحل' : 'الحساب ده ملوش صلاحية على النظام');
      return;
    }
    const setup = await fs.collection('meta').doc('setup').get();
    if (setup.exists) showLogin(); else showSetup(null);
    if (new URLSearchParams(location.search).get('e') === 'noaccess' && !$('authErr').textContent) showErr('الحساب ده موقوف أو ملوش صلاحية');
    hideLoader();
  } catch (e) {
    console.error(e); showLogin(); showErr(fsErr(e)); hideLoader();
  }
});

async function doLogin(){
  clearMsgs();
  const email=$('lEmail').value.trim(), pass=$('lPass').value;
  if(!email||!pass) return showErr('اكتب الإيميل والباسورد');
  const btn=$('loginBtn'); setBusy(btn,true,'جاري الدخول...');
  try { await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ showErr(authErr(e)); $('lPass').value=''; $('lPass').focus(); setBusy(btn,false); }
}

async function forgot(){
  const email=$('lEmail').value.trim();
  if(!email) return showErr('اكتب الإيميل الأول في الخانة وبعدين دوس "نسيت الباسورد"');
  try { await auth.sendPasswordResetEmail(email); showOk('اتبعت لينك تغيير الباسورد على '+email+' (بص في الـ Spam لو مش لاقيه)'); }
  catch(e){ showErr(authErr(e)); }
}

async function doSetup(){
  clearMsgs();
  const name=$('sName').value.trim();
  if(!name) return showErr('اكتب اسمك');
  let user = auth.currentUser;
  const email=$('sEmail').value.trim(), p1=$('sPass').value, p2=$('sPass2').value;
  if(!user){
    if(!email) return showErr('اكتب الإيميل');
    if(p1.length<6) return showErr('الباسورد لازم يكون ٦ حروف على الأقل');
    if(p1!==p2) return showErr('الباسوردين مش زي بعض');
  }
  settingUp = true;
  const btn=$('setupBtn'); setBusy(btn,true,'جاري الإنشاء...');
  try{
    if(!user){
      try { user=(await auth.createUserWithEmailAndPassword(email,p1)).user; }
      catch(e){ if(e.code==='auth/email-already-in-use') user=(await auth.signInWithEmailAndPassword(email,p1)).user; else throw e; }
    }
    const now=new Date().toISOString();
    const b=fs.batch();
    b.set(fs.collection('staff').doc(user.uid),{name,email:user.email,role:'owner',active:true,createdAt:now});
    b.set(fs.collection('meta').doc('setup'),{done:true,ownerUid:user.uid,at:now});
    await b.commit();
    location.replace('dashboard.html');
  }catch(e){
    console.error(e); settingUp=false; setBusy(btn,false);
    showErr(fsErr(e));
  }
}
</script>
</body>
</html>
